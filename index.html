<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>PWA Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #f8f8f8;
    }

    .scene {
      position: relative;
      width: 100%;
      max-width: 428px;
      aspect-ratio: 1284 / 2653;
      background: url('background.png') no-repeat center top;
      background-size: contain;
      overflow: hidden;
    }

    .bus-track {
      position: absolute;
      top: 22.5%;
      left: 34%;
      width: 30%;
      height: 5.5%;
      background-color: #c5ccd7;
      border-radius: 999px;
      z-index: 5;
    }

    .bus-icon {
      position: absolute;
      top: 22.5%;
      left: 43.5%;
      width: 10.5%;
      height: 5.5%;
      z-index: 10;
      background-color: #c5ccd7;
      background-image: url('bus-icon1.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      animation: drive 15.25s ease-in-out infinite;
    }

    @media (max-width: 900px) {
      .scene {
        max-width: 100%;
      }

      .bus-track {
        top: 24.5%;
        left: 33%;
        width: 32%;
        height: 6%;
      }

      .bus-icon {
        top: 24.5%;
        left: 43.5%;
        width: 11.5%;
        height: 6%;
      }
    }

    @media (max-width: 520px) {
      .bus-track {
        top: 27%;
        left: 31.5%;
        width: 36%;
        height: 6.8%;
      }

      .bus-icon {
        top: 27%;
        left: 44.5%;
        width: 12.5%;
        height: 6.8%;
      }
    }

    @keyframes drive {
      0%   { left: 42%; }
      50%  { left: 59.3%; }
      100% { left: 42%; }
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="bus-track"></div>
    <div class="bus-icon"></div>
  </div>
</body>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log("SW ok", reg))
      .catch(err => console.error("SW fail", err));
  }
</script>
</html>
