<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>PWA Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
      background: url('background.png') no-repeat top center;
      background-size: contain;
      background-attachment: scroll;
      overflow: hidden;
    }

    .bus-track {
      position: absolute;
      top: 18.75%;
      left: 42%;
      width: 17.3%;
      height: 2.8%;
      background-color: #c5ccd7;
      z-index: 5;
    }

    .bus-icon {
      position: absolute;
      top: calc(18.75% - 1px);
      left: 47.4%;
      width: auto;
      height: 2.8%;
      aspect-ratio: 50 / 27;
      z-index: 10;
      background-color: #c5ccd7;
      background-image: url('bus-icon1.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      animation: drive 15.25s ease-in-out infinite;
    }

    @media (max-width: 900px) {
      .bus-track {
        top: 19.2%;
        left: 41.8%;
        width: 18.5%;
        height: 3.1%;
      }

      .bus-icon {
        top: calc(19.2% - 1px);
        left: 48%;
        width: auto;
        height: 3.1%;
        aspect-ratio: 50 / 27;
      }
    }

    @media (max-width: 520px) {
      .bus-track {
        top: 20.2%;
        left: 41.5%;
        width: 19.2%;
        height: 3.4%;
      }

      .bus-icon {
        top: calc(20.2% - 1px);
        left: 48.3%;
        width: auto;
        height: 3.4%;
        aspect-ratio: 50 / 27;
      }
    }

    @keyframes drive {
      0%   { left: 42%; }
      50%  { left: 59.3%; }
      100% { left: 42%; }
    }
  </style>
</head>

<body>
  <div class="bus-track"></div>
  <div class="bus-icon"></div>
</body>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log("SW ok", reg))
      .catch(err => console.error("SW fail", err));
  }
</script>
</html>
