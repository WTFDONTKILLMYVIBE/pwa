<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>PWA Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
      background: url('background.png') no-repeat center top;
      background-size: 100% auto;
      background-attachment: scroll;
      overflow: hidden;
    }

    .bus-track {
      position: absolute;
      top: 20.59%;
      left: 42%;
      width: 17.3%;
      height: 2.8%;
      background-color: #c5ccd7;
      z-index: 5;
    }

    .bus-icon {
      position: absolute;
      top: 20.59%;
      left: 47.4%;
      width: 4.5%;
      height: 2.8%;
      z-index: 10;
      background-color: #c5ccd7;
      background-image: url('bus-icon1.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      animation: drive 15.25s ease-in-out infinite;
    }

    @media (max-width: 900px) {
      .bus-track {
        top: 26.5%;
        left: 33%;
        width: 28%;
        height: 5.2%;
      }

      .bus-icon {
        top: 26.5%;
        left: 42.5%;
        width: 8.2%;
        height: 5.2%;
      }
    }

    @media (max-width: 520px) {
      .bus-track {
        top: 28.5%;
        left: 31.5%;
        width: 30%;
        height: 5.8%;
      }

      .bus-icon {
        top: 28.5%;
        left: 43%;
        width: 8.8%;
        height: 5.8%;
      }
    }

    @keyframes drive {
      0%   { left: 42%; }
      50%  { left: 59.3%; }
      100% { left: 42%; }
    }
  </style>
</head>

<body style="margin:0; padding:0; background:url('background.png') no-repeat center top fixed; background-size:contain; position: relative; min-height: 100vh; overflow: hidden;">
  <div class="bus-track"></div>
  <div class="bus-icon"></div>
  <!-- Vollbild Hintergrund -->
</body>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log("SW ok", reg))
      .catch(err => console.error("SW fail", err));
  }
</script>
</html>
