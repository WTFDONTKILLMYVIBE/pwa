<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <title>PWA Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
      background: url('background.png') no-repeat top center;
      background-size: contain;
      background-attachment: scroll;
      overflow: hidden;
    }

    .bus-track {
      position: absolute;
      top: calc(18.75% + 4px);
      left: 42%;
      width: clamp(32.3px, 7.65vw, 50.15px);
      height: clamp(3.4px, 0.595vw, 5.525px);
      background-color: #c5ccd7;
      z-index: 5;
    }

    .bus-icon {
      position: absolute;
      top: calc(18.75% + 2px);
      left: 24.4%;
      width: clamp(33.15px, 7.65vw, 51px);
      height: auto;
      aspect-ratio: 50 / 27;
      z-index: 10;
      background-color: #c5ccd7;
      background-image: url('bus-icon1.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      animation: drive 9s ease-in-out infinite;
    }

    .sensor-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      z-index: 99;
      text-align: center;
      padding: 24px;
    }

    .sensor-overlay__box {
      max-width: 420px;
      width: 100%;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .sensor-overlay__title {
      margin: 0 0 16px;
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .sensor-overlay__text {
      margin: 0 0 24px;
      font-size: 1rem;
      line-height: 1.55;
      color: #d7d7d7;
    }

    .sensor-overlay__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px 24px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 700;
      transition: transform 0.2s ease, background 0.2s ease;
      min-height: 64px;
    }

    .sensor-overlay__button:hover,
    .sensor-overlay__button:focus {
      transform: translateY(-1px);
      background: #3b78c2;
      outline: none;
    }

    .sensor-overlay.hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .bus-track {
        top: calc(19.2% + 4px);
        left: 41.8%;
        width: clamp(34px, 8.5vw, 53.55px);
        height: clamp(3.825px, 0.68vw, 5.95px);
      }

      .bus-icon {
        top: calc(19.2% + 2px);
        left: 28%;
        width: clamp(34.85px, 8.5vw, 54.4px);
        height: auto;
        aspect-ratio: 50 / 27;
      }
    }

    @media (max-width: 520px) {
      .bus-track {
        top: calc(20.2% + 4px);
        left: 41.5%;
        width: clamp(28.9px, 10.2vw, 43.35px);
        height: clamp(3.4px, 0.765vw, 5.1px);
      }

      .bus-icon {
        top: calc(20.2% + 2px);
        left: 28.3%;
        width: clamp(29.75px, 10.2vw, 44.2px);
        height: auto;
        aspect-ratio: 50 / 27;
      }
    }

    @keyframes drive {
      0%   { left: 24.4%; }
      50%  { left: 64.26%; }
      100% { left: 24.4%; }
    }
  </style>
</head>

<body>
  <div class="bus-track"></div>
  <div class="bus-icon"></div>

  <div class="sensor-overlay" id="sensorOverlay">
    <div class="sensor-overlay__box">
      <h1 class="sensor-overlay__title">Bewegungssensor aktivieren</h1>
      <p class="sensor-overlay__text">Tippe einmal, um den Zugriff auf die Neigungssensoren deines iPhones zu erlauben. Danach bewegt sich der Bus je nach deiner iPhone-Position.</p>
      <button type="button" class="sensor-overlay__button" id="sensorButton">Sensor starten</button>
      <p class="sensor-overlay__status" id="sensorStatus"></p>
    </div>
  </div>
</body>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log("SW ok", reg))
      .catch(err => console.error("SW fail", err));
  }

  const sensorOverlay = document.getElementById('sensorOverlay');
  const sensorButton = document.getElementById('sensorButton');
  const sensorStatus = document.getElementById('sensorStatus');
  const busIcon = document.querySelector('.bus-icon');
  let useSensor = false;
  const minLeft = 24.4;
  const maxLeft = 64.26;
  const trackRange = maxLeft - minLeft;

  function updateBusPosition(angle) {
    const limitedAngle = Math.max(-45, Math.min(45, angle));
    const normalized = (limitedAngle + 45) / 90;
    const target = minLeft + normalized * trackRange;
    const clamped = Math.min(maxLeft, Math.max(minLeft, target));
    busIcon.style.left = `${clamped}%`;
  }

  function handleOrientation(event) {
    if (!useSensor) return;
    const angle = event.gamma ?? event.beta ?? 0;
    updateBusPosition(angle);
  }

  function handleMotion(event) {
    if (!useSensor) return;
    const gravityX = event.accelerationIncludingGravity?.x;
    if (gravityX == null) return;
    updateBusPosition(-gravityX * 9);
  }

  async function enableSensor() {
    sensorButton.disabled = true;
    sensorButton.textContent = 'Ermögliche Sensorzugriff...';

    const activate = () => {
      window.addEventListener('deviceorientation', handleOrientation);
      window.addEventListener('devicemotion', handleMotion);
      useSensor = true;
      busIcon.style.animation = 'none';
      sensorOverlay.classList.add('hidden');
    };

    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          activate();
          return;
        }
        sensorStatus.textContent = 'Sensorzugriff wurde nicht gewährt. Versuche es dennoch.';
        console.warn('Device orientation permission denied', permission);
        activate();
        return;
      }

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission === 'granted') {
          activate();
          return;
        }
        sensorStatus.textContent = 'Sensorzugriff wurde nicht gewährt. Versuche es dennoch.';
        console.warn('Device motion permission denied', permission);
        activate();
        return;
      }

      activate();
    } catch (error) {
      console.warn('Sensor permission request failed', error);
      activate();
    } finally {
      sensorButton.disabled = false;
      if (sensorButton.textContent !== 'Zugriff verweigert') {
        sensorButton.textContent = 'Sensor starten';
      }
    }
  }

  sensorButton.addEventListener('click', enableSensor);
  sensorButton.addEventListener('touchend', enableSensor);
  sensorButton.addEventListener('pointerup', enableSensor);
</script>
</html>
