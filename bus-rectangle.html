<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bus Highlight</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }
    .frame {
      position: relative;
      width: min(95vw, 900px);
      border: 1px solid #444;
      background: #000;
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    .highlight {
      position: absolute;
      top: 20.59%;
      left: 44.4%;
      width: 10.0%;
      height: 2.6%;
      border: 4px solid rgba(0, 128, 255, 0.9);
      box-shadow: 0 0 0 2px rgba(0, 128, 255, 0.5);
      pointer-events: none;
    }
    .label {
      position: absolute;
      top: calc(20.59% - 1.5rem);
      left: 44.4%;
      color: #fff;
      font: 600 0.95rem system-ui, sans-serif;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.45);
      padding: 0.25rem 0.5rem;
      border-radius: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="background.png" alt="background image" />
    <div class="highlight"></div>
    <div class="label">Bus region</div>
  </div>
</body>
</html>
